{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}CoreLab{% endblock %}</title>
  
  <!-- CSS principal del sitio -->
  <link rel="stylesheet" href="{% static 'core_lab/css/style.css' %}">
  
  <!-- Bloque para CSS adicional de páginas específicas -->
  {% block extra_css %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="topbar">
    <div class="brand">CoreLab</div>
    <div class="menu">
      <a href="{% url 'home' %}">Inicio</a>
      <a href="{% url 'materiales' %}">Materiales</a>
      <a href="{% url 'simulacion' %}">Simulación</a>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 CoreLab — Laboratorio Virtual de Materiales (educativo)</p>
  </footer>

  <!-- SCRIPTS ADICIONALES -->
  {% block scripts %}{% endblock %}
</body>
</html>
